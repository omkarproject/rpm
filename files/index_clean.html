const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
const COL={
  'response #':'id','response':'id','sr no':'id','sr':'id',
  'date':'report_date','report date':'report_date',
  'time':'report_time','report time':'report_time',
  'vehicle no':'vehicle_no','vehicle number':'vehicle_no','vehicle':'vehicle_no','veh no':'vehicle_no',
  'vehicle type':'vehicle_type','veh type':'vehicle_type','type':'vehicle_type',
  'mileage':'mileage','km/l':'mileage','kmpl':'mileage','fuel efficiency':'mileage',
  'from location':'from_location','from':'from_location','origin':'from_location',
  'last location':'last_location','to location':'last_location','to':'last_location','destination':'last_location',
  'current km':'current_km','odometer':'current_km','km reading':'current_km','km':'current_km',
  'diesel amount':'diesel_amount','fuel amount':'diesel_amount','amount':'diesel_amount',
  'diesel':'diesel_amount','fuel':'diesel_amount','fuel cost':'diesel_amount',
  'vendor name':'vendor_name','vendor':'vendor_name','supplier':'vendor_name','petrol pump':'vendor_name',
  'note':'note','notes':'note','remarks':'note','comment':'note','comments':'note',
};
const NUM_F=new Set(['diesel_amount','current_km','mileage']);

const parseDate=v=>{
  if(!v)return null;
  if(v instanceof Date&&!isNaN(v))return v.toISOString().split('T')[0];
  const s=String(v).trim();
  // DD-MM-YYYY or DD/MM/YYYY
  let m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
  if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  // numeric Excel serial
  if(/^\d{5}$/.test(s)){
    const d=new Date(Math.round((+s-25569)*86400*1000));
    return d.toISOString().split('T')[0];
  }
  return null;
};

const parseRows=raw=>{
  return raw.map(row=>{
    const nr={};
    Object.keys(row).forEach(k=>{
      const mk=COL[k.toLowerCase().trim()]||k.toLowerCase().replace(/\s+/g,'_').trim();
      let v=row[k];
      if(mk==='report_date')v=parseDate(v);
      else if(NUM_F.has(mk))v=parseFloat(String(v).replace(/[^\d.]/g,''))||0;
      nr[mk]=v;
    });
    return nr;
  }).filter(r=>(r.diesel_amount&&r.diesel_amount>0)||r.vehicle_no);
};

/* ═══════════════════════════════════════════════════════
   FILTERS & CALCULATIONS
═══════════════════════════════════════════════════════ */
const getTodayRange = () => {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const today = String(now.getDate()).padStart(2, '0');
  const dateStr = `${year}-${month}-${today}`;
  return {
    startDate: dateStr,
    endDate: dateStr
  };
};
const defaultDates = getTodayRange();
const getAssignedVendorInfo = () => {
  let parentVendor = '';
  let parentRole = '';
  try {
    if (window.parent && typeof window.parent.getAssignedVendorName === 'function') {
      parentVendor = window.parent.getAssignedVendorName();
    }
    if (window.parent && typeof window.parent.getAuthSession === 'function') {
      parentRole = window.parent.getAuthSession('rpm_user_role') || '';
      if (!parentVendor) parentVendor = window.parent.getAuthSession('rpm_assigned_vendor') || '';
    }
  } catch(e) {}

  const role = parentRole || localStorage.getItem('rpm_user_role') || sessionStorage.getItem('rpm_user_role') || '';
  let vendor = parentVendor || localStorage.getItem('rpm_assigned_vendor') || sessionStorage.getItem('rpm_assigned_vendor') || '';

  const isVendorRole = (role === 'vendor');
  if (isVendorRole && !vendor) {
    try {
      if (window.parent && Array.isArray(window.parent.vendorsList) && window.parent.vendorsList.length > 0) {
        vendor = window.parent.vendorsList[0].name || window.parent.vendorsList[0];
      }
    } catch(e) {}
  }

  const isLocked = isVendorRole || !!vendor;
  return { role, vendor, isLocked };
};

const getInitialEF = () => {
  const { vendor, isLocked } = getAssignedVendorInfo();
  const initialVendor = isLocked ? [vendor] : [];
  return { startDate: defaultDates.startDate, endDate: defaultDates.endDate, vehicleType: [], vehicleNo: [], vendor: initialVendor, fromLoc: [], toLoc: [], minAmt: '', maxAmt: '' };
};
const EF = getInitialEF();

const filterRows=(rows,f,q='')=>{
  const { vendor, isLocked } = getAssignedVendorInfo();
  const effectiveVendor = isLocked ? [vendor] : f.vendor;

  return rows.filter(r=>{
    if(f.startDate                 &&(r.report_date||'')<f.startDate)return false;
    if(f.endDate                   &&(r.report_date||'')>f.endDate)  return false;
    if(f.vehicleType&&f.vehicleType.length&&!f.vehicleType.includes(r.vehicle_type))return false;
    if(f.vehicleNo  &&f.vehicleNo.length  &&!f.vehicleNo.includes(r.vehicle_no))    return false;
    if(effectiveVendor && effectiveVendor.length && !effectiveVendor.includes(r.vendor_name)) return false;
    if(f.fromLoc    &&f.fromLoc.length    &&!f.fromLoc.includes(r.from_location))   return false;
    if(f.toLoc      &&f.toLoc.length      &&!f.toLoc.includes(r.last_location))     return false;
    if(f.minAmt                    &&(r.diesel_amount||0)<+f.minAmt) return false;
    if(f.maxAmt                    &&(r.diesel_amount||0)>+f.maxAmt) return false;
    if(q){
      const s=q.toLowerCase();
      return(r.vehicle_no||'').toLowerCase().includes(s)||
             (r.vendor_name||'').toLowerCase().includes(s)||
             (r.from_location||'').toLowerCase().includes(s)||
             (r.last_location||'').toLowerCase().includes(s)||
             (r.vehicle_type||'').toLowerCase().includes(s);
    }
    return true;
  });
};

const getOpts=rows=>({
  vtypes: [...new Set(rows.map(r=>r.vehicle_type).filter(Boolean))].sort(),
  vnos:   [...new Set(rows.map(r=>r.vehicle_no).filter(Boolean))].sort(),
  vendors:[...new Set(rows.map(r=>r.vendor_name).filter(Boolean))].sort(),
  froms:  [...new Set(rows.map(r=>r.from_location).filter(Boolean))].sort(),
  tos:    [...new Set(rows.map(r=>r.last_location).filter(Boolean))].sort(),
});

const quickRange=days=>{
  const fmt=ts=>{const d=new Date(ts);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
  return{startDate:fmt(Date.now()-days*864e5),endDate:fmt(Date.now())};
};

/* Perfect calculations */
const calcStats=rows=>{
  if(!rows.length)return null;
  const amts=rows.map(r=>r.diesel_amount||0);
  const pos =amts.filter(a=>a>0);
  const tot =amts.reduce((a,b)=>a+b,0);
  // Median: proper sorted midpoint
  const s=[...amts].sort((a,b)=>a-b),mid=Math.floor(s.length/2);
  const median=s.length%2?s[mid]:(s[mid-1]+s[mid])/2;

  // By date
  const dm={};
  rows.forEach(r=>{const k=r.report_date||'?';if(!dm[k])dm[k]={amount:0,count:0};dm[k].amount+=r.diesel_amount||0;dm[k].count++;});
  const by_date=Object.entries(dm).sort(([a],[b])=>a.localeCompare(b)).map(([report_date,v])=>({report_date,...v}));

  // By week (ISO Monday-anchored)
  const wm={};
  rows.forEach(r=>{
    if(!r.report_date)return;
    const d=new Date(r.report_date);
    if(isNaN(d.getTime()))return;
    const dy=d.getDay(),diff=d.getDate()-dy+(dy===0?-6:1);
    const w=new Date(d);w.setDate(diff);
    if(isNaN(w.getTime()))return;
    const ws=w.toISOString().split('T')[0];
    if(!wm[ws])wm[ws]={amount:0,count:0};
    wm[ws].amount+=r.diesel_amount||0;wm[ws].count++;
  });
  const by_week=Object.entries(wm).sort(([a],[b])=>a.localeCompare(b)).map(([week_start,v])=>({week_start,...v}));

  // By month
  const mm2={};
  rows.forEach(r=>{
    if(!r.report_date)return;
    const p2=String(r.report_date).split('-');
    if(p2.length<2)return;
    const mk=`${p2[0]}-${p2[1]}`; // YYYY-MM
    if(!mm2[mk])mm2[mk]={amount:0,count:0};
    mm2[mk].amount+=r.diesel_amount||0;mm2[mk].count++;
  });
  const by_month=Object.entries(mm2).sort(([a],[b])=>a.localeCompare(b)).map(([month,v])=>({month,...v}));

  // By day of week
  const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dowm={};DOW.forEach(d=>{dowm[d]={amount:0,count:0};});
  rows.forEach(r=>{
    if(!r.report_date)return;
    const d=new Date(r.report_date);
    if(isNaN(d.getTime()))return;
    const dk=DOW[d.getDay()];
    if(!dk)return;
    dowm[dk].amount+=r.diesel_amount||0;dowm[dk].count++;
  });
  const by_dow=DOW.map(d=>({day:d,...dowm[d]}));

  // By vehicle type
  const tm={};
  rows.forEach(r=>{const t=r.vehicle_type||'Unknown';if(!tm[t])tm[t]={count:0,amount:0};tm[t].amount+=r.diesel_amount||0;tm[t].count++;});
  const by_type=Object.entries(tm).sort(([,a],[,b])=>b.amount-a.amount).map(([vehicle_type,v])=>({vehicle_type,...v}));

  // By vehicle
  const vm={};
  rows.forEach(r=>{
    const k=r.vehicle_no||'?';
    if(!vm[k])vm[k]={amts:[],type:r.vehicle_type||''};
    vm[k].amts.push(r.diesel_amount||0);
    if(r.vehicle_type)vm[k].type=r.vehicle_type;
  });
  const all_vehicles=Object.entries(vm).map(([vehicle_no,v])=>{
    const tot2=v.amts.reduce((a,b)=>a+b,0),pos2=v.amts.filter(a=>a>0);
    return{vehicle_no,vehicle_type:v.type,trip_count:v.amts.length,amount:tot2,
      avg_amount:v.amts.length?tot2/v.amts.length:0,
      max_amount:v.amts.length?Math.max(...v.amts):0,
      min_amount:pos2.length?Math.min(...pos2):0};
  }).sort((a,b)=>b.amount-a.amount);

  // By vendor
  const vnm={};
  rows.forEach(r=>{const k=r.vendor_name||'?';if(!vnm[k])vnm[k]={amts:[]};vnm[k].amts.push(r.diesel_amount||0);});
  const all_vendors=Object.entries(vnm).map(([vendor_name,v])=>{
    const tot2=v.amts.reduce((a,b)=>a+b,0);
    return{vendor_name,trip_count:v.amts.length,amount:tot2,avg_amount:v.amts.length?tot2/v.amts.length:0};
  }).sort((a,b)=>b.amount-a.amount);

  // By location
  const grpLoc=(key)=>{
    const m={};
    rows.forEach(r=>{const l=r[key]||'?';if(!m[l])m[l]={amount:0,trip_count:0};m[l].amount+=r.diesel_amount||0;m[l].trip_count++;});
    return Object.entries(m).sort(([,a],[,b])=>b.trip_count-a.trip_count).slice(0,20).map(([location,v])=>({location,...v}));
  };

  return{
    summary:{
      total_entries:rows.length,total_spend:tot,avg_spend:tot/rows.length,
      today_spend:(()=>{const t=new Date();const td=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;return rows.filter(r=>r.report_date===td).reduce((s,r)=>s+(r.diesel_amount||0),0);})(),
      median_spend:median,max_spend:pos.length?Math.max(...amts):0,
      min_spend:pos.length?Math.min(...pos):0,
      unique_vehicles:[...new Set(rows.map(r=>r.vehicle_no).filter(Boolean))].length,
      unique_vendors:[...new Set(rows.map(r=>r.vendor_name).filter(Boolean))].length,
      active_days:[...new Set(rows.map(r=>r.report_date).filter(Boolean))].length,
    },
    by_date,by_week,by_month,by_dow,by_type,all_vehicles,all_vendors,
    top_vehicles:all_vehicles.slice(0,10),top_vendors:all_vendors.slice(0,10),
    by_from_location:grpLoc('from_location'),by_to_location:grpLoc('last_location'),
  };
};

  bldg:     p=><I className={p.c} d={['M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z','M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2','M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2','M10 6h4','M10 10h4','M10 14h4','M10 18h4']}/>,
  pin:      p=><I className={p.c} d={['M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z']} extra={[<circle key="a" cx="12" cy="10" r="3"/>]}/>,

function ChartDaily({data,dark}){
  const d2=data.map(d=>({date:dateLbl(d.report_date),v:d.amount}));
  const tc=dark?'#64748b':'#94a3b8',gc=dark?'#1e293b':'#f1f5f9';
  return(
    <ResponsiveContainer width="100%" height="100%">
      <AreaChart data={d2} margin={{top:8,right:8,left:0,bottom:0}}>
        <defs><linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
          <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.2}/>
          <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
        </linearGradient></defs>
        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={gc}/>
        <XAxis dataKey="date" fontSize={11} tickLine={false} axisLine={false} interval="preserveStartEnd" tick={{fill:tc}}/>
        <YAxis fontSize={11} tickLine={false} axisLine={false} tickFormatter={short} width={60} tick={{fill:tc}}/>
        <Tooltip contentStyle={tipSt(dark)} formatter={v=>[rupee(v),'Spend']} labelStyle={{fontWeight:600,marginBottom:4}}/>

function ChartWeek({data,dark}){

function ChartMonthly({data,dark}){
  const MO2=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d2=data.map(d=>{
    const p=String(d.month).split('-');
    return{m:MO2[parseInt(p[1]||'1')-1]+' '+p[0],v:d.amount,cnt:d.count};
  });
  const tc=dark?'#64748b':'#94a3b8',gc=dark?'#1e293b':'#f1f5f9';
  return(
    <ResponsiveContainer width="100%" height="100%">
      <BarChart data={d2} margin={{top:8,right:8,left:0,bottom:0}}>
        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={gc}/>
        <XAxis dataKey="m" fontSize={11} tickLine={false} axisLine={false} tick={{fill:tc}}/>
        <YAxis fontSize={11} tickLine={false} axisLine={false} tickFormatter={short} width={60} tick={{fill:tc}}/>
        <Tooltip contentStyle={tipSt(dark)} formatter={v=>[rupee(v),'Monthly']}/>
        <Bar dataKey="v" radius={[6,6,0,0]} maxBarSize={56}>
          {d2.map((_,i)=><Cell key={i} fill={col(i+3)}/>)}
        </Bar>
      </BarChart>
    </ResponsiveContainer>
  );
}

function ChartDonut({data,dark}){
  const d2=data.map(d=>({name:d.vehicle_type||'Unknown',value:d.amount}));
  const total=d2.reduce((s,d)=>s+d.value,0);
  return(
    <div>
      <div style={{height:185}}>
        <ResponsiveContainer width="100%" height="100%">
          <PieChart>
            <Pie data={d2} innerRadius={54} outerRadius={76} paddingAngle={3} dataKey="value" startAngle={90} endAngle={-270}>
              {d2.map((_,i)=><Cell key={i} fill={col(i)}/>)}
            </Pie>
            <Tooltip contentStyle={tipSt(dark)} formatter={v=>[rupee(v),'Spend']}/>
          </PieChart>
        </ResponsiveContainer>
      </div>
      <div className="mt-3 space-y-2">
        {d2.map((d,i)=>{
          const pct=total?((d.value/total)*100).toFixed(1):'0';
          return(
            <div key={d.name} className="flex items-center gap-2 text-xs">
              <div className="w-2.5 h-2.5 rounded-sm flex-shrink-0" style={{background:col(i)}}/>
              <span className="text-slate-500 dark:text-slate-400 flex-1 truncate">{d.name}</span>
              <span className="text-slate-400 text-[10px]">{pct}%</span>
              <span className="font-bold text-slate-800 dark:text-slate-100">{rupee(d.value)}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function HBar({data,lk,vk,off=0}){
  const mx=Math.max(...data.map(d=>d[vk]||0),1);
  return(
    <div className="space-y-3">
      {data.map((d,i)=>{
        const v=d[vk]||0,pct=(v/mx)*100;
        return(
          <div key={i}>
            <div className="flex justify-between items-center mb-1">
              <span className="text-xs font-medium text-slate-700 dark:text-slate-300 truncate max-w-[200px]">{d[lk]||'—'}</span>
              <span className="text-xs font-bold text-slate-900 dark:text-slate-100 ml-2 flex-shrink-0">{rupee(v)}</span>
            </div>
            <div className="h-1.5 bg-slate-100 dark:bg-slate-700/60 rounded-full overflow-hidden">
              <div className="h-full rounded-full bar-w" style={{width:`${pct}%`,background:col(i+off)}}/>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function TripBar({data,lk,off=0}){
  const mx=Math.max(...data.map(d=>d.trip_count||0),1);
  return(
    <div className="space-y-3">
      {data.map((d,i)=>{
        const cnt=d.trip_count||0,pct=(cnt/mx)*100;
        return(
          <div key={i}>
            <div className="flex justify-between items-center mb-1">
              <span className="text-xs font-medium text-slate-700 dark:text-slate-300 truncate max-w-[200px]">{d[lk]||'—'}</span>
              <span className="text-xs font-bold text-slate-900 dark:text-slate-100 ml-2 flex-shrink-0">{cnt} trips</span>

            </div>
          </div>

/* ═══════════════════════════════════════════════════════
   UPLOAD BOX
═══════════════════════════════════════════════════════ */
function UploadBox({onImportData,onDone}){
  const[drag,setDrag]=useState(false);
  const[busy,setBusy]=useState(false);
  const ref=useRef();

  const process=useCallback(file=>{
    setBusy(true);
    const rd=new FileReader();
    rd.onload=async e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'binary',cellDates:true});
        const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
        const rows=parseRows(raw);
        if(!rows.length){
          toast.err('No valid data found in file.');
        }else{
          await onImportData(rows);
          toast.ok(`✓ Imported ${num(rows.length)} records`);
          onDone(rows.length);
        }
      }catch(err){
        toast.err('Error reading or uploading file.');
        console.error(err);
      }finally{
        setBusy(false);
      }
    };
    rd.readAsBinaryString(file);
  },[onImportData,onDone]);

  const base='border-2 border-dashed rounded-2xl cursor-pointer flex flex-col items-center justify-center py-20 text-center select-none transition-all duration-200 ';
  const cls=drag?base+'border-blue-500 bg-blue-50 dark:bg-blue-950/30 scale-[1.01]':base+'border-slate-300 dark:border-slate-700 hover:border-blue-400 hover:bg-slate-50 dark:hover:bg-slate-900/60 bg-white dark:bg-slate-900';

  return(
    <div className={cls}
      onDragOver={e=>{e.preventDefault();setDrag(true);}}
      onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);const f=e.dataTransfer.files[0];if(f)process(f);}}
      onClick={()=>ref.current?.click()}>
      <input type="file" ref={ref} className="hidden" accept=".xlsx,.xls,.csv" onChange={e=>e.target.files?.[0]&&process(e.target.files[0])}/>
      {busy?(
        <div className="flex flex-col items-center gap-4">
          <div className="w-16 h-16 rounded-2xl bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center">
            <Ic.spin c="w-8 h-8 text-blue-600 dark:text-blue-400"/>
          </div>
          <p className="text-slate-500 dark:text-slate-400 anim-pulse font-medium">Processing…</p>
        </div>
      ):(
        <>
          <div className={`w-16 h-16 rounded-2xl bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center mb-5 transition-transform duration-200 ${drag?'scale-110':''}`}>
            <Ic.upload c="w-8 h-8 text-blue-600 dark:text-blue-400"/>
          </div>
          <h3 className="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-2">{drag?'Drop to import':'Click or drag your fuel report'}</h3>
          <p className="text-sm text-slate-500 dark:text-slate-400 max-w-xs">Supports <strong>.xlsx</strong>, <strong>.xls</strong>, <strong>.csv</strong> — columns auto-detected</p>
          <div className="mt-5 flex flex-wrap gap-2 justify-center">
            {['Date','Vehicle No','Vehicle Type','Diesel Amount','Vendor Name','Location'].map(c=>(
              <span key={c} className="text-xs bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-md px-2 py-1">{c}</span>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   FILTER PANEL
═══════════════════════════════════════════════════════ */
const FLbl=({ch})=><label className="text-[10px] font-semibold text-slate-500 dark:text-slate-500 uppercase tracking-wider block mb-1">{ch}</label>;
const finp='w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-3 h-8 text-xs outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-200 dark:focus:ring-blue-900 placeholder-slate-400 dark:placeholder-slate-600 transition-colors';
const FInp=({...p})=><input className={finp} {...p}/>;
const FSel=({val,onChange,ch})=>(
  <select value={val} onChange={e=>onChange(e.target.value)} className={finp}>{ch}</select>
);

/* Multi-select pill keys */
const MULTI_KEYS=['vehicleType','vehicleNo','vendor','fromLoc','toLoc'];
const MULTI_LBL={vehicleType:'Type',vehicleNo:'Vehicle',vendor:'Vendor',fromLoc:'From',toLoc:'To'};

/* ── MultiSelect dropdown — portal-based so it never gets clipped ── */
function MultiSelect({label,options,selected,onChange}){
  const { vendor, isLocked } = getAssignedVendorInfo();
  const isVendorControl = typeof label === 'string' && label.toLowerCase().includes('vendor');

  if (isLocked && isVendorControl) {
    return (
      <div className="relative">
        <button type="button" disabled className="w-full rounded-lg border border-slate-200 dark:border-slate-700 h-8 px-3 text-xs text-left flex items-center justify-between gap-2 bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-200 cursor-not-allowed">
          <span className="truncate font-semibold text-slate-700 dark:text-slate-200">{vendor || 'Assigned Vendor'}</span>
          <span className="text-amber-400 text-xs">🔒</span>
        </button>
      </div>
    );
  }

  const[open,setOpen]=useState(false);
  const[pos,setPos]=useState({top:0,left:0,width:0});
  const btnRef=useRef();
  const dropRef=useRef();

  const openDrop=()=>{
    if(btnRef.current){
      const r=btnRef.current.getBoundingClientRect();
      setPos({top:r.bottom+window.scrollY+4,left:r.left+window.scrollX,width:r.width});
    }
    setOpen(o=>!o);
  };

  useEffect(()=>{
    const h=e=>{
      if(open&&btnRef.current&&!btnRef.current.contains(e.target)&&dropRef.current&&!dropRef.current.contains(e.target))
        setOpen(false);
    };
    const s=()=>{if(open&&btnRef.current){const r=btnRef.current.getBoundingClientRect();setPos({top:r.bottom+window.scrollY+4,left:r.left+window.scrollX,width:r.width});}};
    document.addEventListener('mousedown',h);
    window.addEventListener('scroll',s,true);
    window.addEventListener('resize',s);
    return()=>{document.removeEventListener('mousedown',h);window.removeEventListener('scroll',s,true);window.removeEventListener('resize',s);};
  },[open]);

  const toggle=v=>{const s=Array.isArray(selected)?selected:[];onChange(s.includes(v)?s.filter(x=>x!==v):[...s,v]);};
  const selAll =()=>onChange([...options]);
  const clearAll=()=>onChange([]);
  const sel=Array.isArray(selected)?selected:[];
  const lbl=sel.length===0?`All ${label}`:sel.length===1?sel[0]:`${sel.length} selected`;

  const dropdown=open&&ReactDOM.createPortal(
    <div ref={dropRef} style={{position:'absolute',top:pos.top,left:pos.left,width:Math.max(pos.width,200),maxWidth:280,zIndex:99999}}
      className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl anim-fadeup overflow-hidden">
      <div className="flex items-center justify-between px-3 py-2 border-b border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60">
        <button type="button" onClick={selAll} className="text-[11px] font-semibold text-blue-600 dark:text-blue-400 hover:underline">Select All</button>
        <span className="text-[10px] text-slate-400">{sel.length}/{options.length} selected</span>
        <button type="button" onClick={clearAll} className="text-[11px] font-semibold text-red-500 dark:text-red-400 hover:underline">Clear</button>
      </div>
      <div className="max-h-[220px] overflow-y-auto py-1">
        {options.length===0&&<div className="px-3 py-4 text-xs text-slate-400 text-center">No options available</div>}
        {options.map(opt=>{
          const checked=sel.includes(opt);
          return(
            <label key={opt} onClick={()=>toggle(opt)}
              className={`flex items-center gap-2.5 px-3 py-2 cursor-pointer text-xs transition-colors select-none
                ${checked?'bg-blue-50 dark:bg-blue-950/50':'hover:bg-slate-50 dark:hover:bg-slate-700/40'}`}>
              <span className={`w-4 h-4 rounded flex-shrink-0 border-2 flex items-center justify-center transition-colors
                ${checked?'bg-blue-600 border-blue-600':'border-slate-300 dark:border-slate-600'}`}>
                {checked&&<svg xmlns="http://www.w3.org/2000/svg" className="w-2.5 h-2.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}><path d="M5 13l4 4L19 7"/></svg>}
              </span>
              <span className={`truncate ${checked?'font-semibold text-slate-800 dark:text-slate-100':'text-slate-600 dark:text-slate-300'}`}>{opt}</span>
            </label>
          );
        })}
      </div>
    </div>,
    document.body
  );

  return(
    <div className="relative">
      <button ref={btnRef} type="button" onClick={openDrop}
        className={`w-full rounded-lg border h-8 px-3 text-xs text-left flex items-center justify-between gap-2 outline-none transition-colors
          ${open?'border-blue-400 ring-1 ring-blue-200 dark:ring-blue-900':'border-slate-200 dark:border-slate-700'}
          bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100`}>
        <span className="truncate">{lbl}</span>
        <span className="flex items-center gap-1 flex-shrink-0">
          {sel.length>0&&<span className="bg-blue-600 text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">{sel.length}</span>}
          <svg xmlns="http://www.w3.org/2000/svg" className={`w-3 h-3 text-slate-400 transition-transform ${open?'rotate-180':''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path d="M19 9l-7 7-7-7"/></svg>
        </span>
      </button>
      {dropdown}
    </div>
  );
}

function FilterPanel({filters,opts,setF,reset,close,fc}){
  const setRange=days=>{const r=quickRange(days);setF('startDate',r.startDate);setF('endDate',r.endDate);};
  return(
    <div className="bg-white dark:bg-slate-900 border border-blue-200 dark:border-blue-900/40 rounded-2xl shadow-lg anim-fadeup">
      <div className="p-5">
        <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center">
              <Ic.filter c="w-4 h-4 text-blue-600 dark:text-blue-400"/>
            </div>
            <span className="font-semibold text-sm text-slate-800 dark:text-slate-200">Filters</span>
            {fc>0&&<span className="bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 text-[11px] font-semibold rounded-full px-2 py-0.5">{fc} active</span>}
          </div>
          <div className="flex items-center gap-1.5 flex-wrap">
            {[7,30,90].map(d=>(
              <button key={d} onClick={()=>setRange(d)} className="h-7 px-2.5 text-[11px] font-medium rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Last {d}d</button>
            ))}
            {fc>0&&<button onClick={reset} className="h-7 px-2.5 text-[11px] font-medium rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition-colors flex items-center gap-1"><Ic.x c="w-3 h-3"/> Reset</button>}
            <button onClick={close} className="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><Ic.x c="w-4 h-4"/></button>
          </div>
        </div>
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
          <div><FLbl ch="Date From"/><FInp type="date" value={filters.startDate} onChange={e=>setF('startDate',e.target.value)}/></div>
          <div><FLbl ch="Date To"/><FInp type="date" value={filters.endDate} onChange={e=>setF('endDate',e.target.value)}/></div>
          <div><FLbl ch="Vehicle Type"/><MultiSelect label="Types" options={opts.vtypes} selected={filters.vehicleType} onChange={v=>setF('vehicleType',v)}/></div>
          <div><FLbl ch="Vehicle No"/><MultiSelect label="Vehicles" options={opts.vnos} selected={filters.vehicleNo} onChange={v=>setF('vehicleNo',v)}/></div>
          <div><FLbl ch="Vendor"/><MultiSelect label="Vendors" options={opts.vendors} selected={filters.vendor} onChange={v=>setF('vendor',v)}/></div>
          <div><FLbl ch="From Location"/><MultiSelect label="Locations" options={opts.froms} selected={filters.fromLoc} onChange={v=>setF('fromLoc',v)}/></div>
          <div><FLbl ch="To Location"/><MultiSelect label="Destinations" options={opts.tos} selected={filters.toLoc} onChange={v=>setF('toLoc',v)}/></div>
          <div><FLbl ch="Min Amount (₹)"/><FInp type="number" placeholder="0" value={filters.minAmt} onChange={e=>setF('minAmt',e.target.value)}/></div>
          <div><FLbl ch="Max Amount (₹)"/><FInp type="number" placeholder="No limit" value={filters.maxAmt} onChange={e=>setF('maxAmt',e.target.value)}/></div>
        </div>
        {fc>0&&(
          <div className="flex flex-wrap gap-1.5 mt-4 pt-4 border-t border-blue-100 dark:border-blue-900/30">
            {/* Date pills */}
            {filters.startDate&&(
              <span className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-medium bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-300">
                From: {filters.startDate}
                <button onClick={()=>setF('startDate','')} className="ml-0.5 hover:text-blue-600"><Ic.x c="w-3 h-3"/></button>
              </span>
            )}
            {filters.endDate&&(
              <span className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-medium bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-300">
                To: {filters.endDate}
                <button onClick={()=>setF('endDate','')} className="ml-0.5 hover:text-blue-600"><Ic.x c="w-3 h-3"/></button>
              </span>
            )}
            {/* Multi-select pills */}
            {MULTI_KEYS.filter(k=>filters[k]&&filters[k].length>0).map(k=>(
              (filters[k]||[]).map(val=>(
                <span key={k+val} className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-medium bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-300">
                  {MULTI_LBL[k]}: {val}
                  <button onClick={()=>setF(k,(filters[k]||[]).filter(x=>x!==val))} className="ml-0.5 hover:text-blue-600"><Ic.x c="w-3 h-3"/></button>
                </span>
              ))
            ))}
            {/* Amount pills */}
            {filters.minAmt&&(
              <span className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-medium bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-300">
                Min: ₹{filters.minAmt}
                <button onClick={()=>setF('minAmt','')} className="ml-0.5 hover:text-blue-600"><Ic.x c="w-3 h-3"/></button>
              </span>
            )}
            {filters.maxAmt&&(
              <span className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-[11px] font-medium bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-300">
                Max: ₹{filters.maxAmt}
                <button onClick={()=>setF('maxAmt','')} className="ml-0.5 hover:text-blue-600"><Ic.x c="w-3 h-3"/></button>
              </span>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function ChartDow({data,dark}){
  const tc=dark?'#64748b':'#94a3b8',gc=dark?'#1e293b':'#f1f5f9';
  return(
    <ResponsiveContainer width="100%" height="100%">
      <BarChart data={data.map(d=>({d:d.day,v:d.amount,c:d.count}))} margin={{top:8,right:8,left:0,bottom:0}}>
        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={gc}/>
        <XAxis dataKey="d" fontSize={11} tickLine={false} axisLine={false} tick={{fill:tc}}/>
        <YAxis fontSize={11} tickLine={false} axisLine={false} tickFormatter={short} width={60} tick={{fill:tc}}/>
        <Tooltip contentStyle={tipSt(dark)} formatter={(v,n,p)=>[rupee(v)+' · '+p.payload.c+' fills','Spend']}/>
        <Bar dataKey="v" radius={[5,5,0,0]} maxBarSize={48}>
          {data.map((_,i)=><Cell key={i} fill={col(i+1)}/>)}
        </Bar>
      </BarChart>
    </ResponsiveContainer>
  );
}

function TabOverview({stats,dark}){
  const MO3X=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthChartData=stats.by_month.map(r=>{
    const p=String(r.month).split('-');
    return{m:MO3X[parseInt(p[1])-1]+' '+p[0],v:r.amount,c:r.count};
  });
  const tc=dark?'#64748b':'#94a3b8',gc=dark?'#1e293b':'#f1f5f9';

  // Spend stats for highlight cards
  const maxDay =stats.by_date.reduce((a,b)=>b.amount>a.amount?b:a,{amount:0,report_date:'—'});
  const maxMonth=stats.by_month.reduce((a,b)=>b.amount>a.amount?b:a,{amount:0,month:'—'});
  const topDow  =stats.by_dow.reduce((a,b)=>b.amount>a.amount?b:a,{amount:0,day:'—'});

  return(
    <div className="space-y-4 anim-fadeup">

      {/* ── Row 1: Quick insight cards ── */}

        <div className="bg-gradient-to-br from-blue-600 to-blue-700 rounded-2xl p-4 text-white">
          <div className="text-[10px] font-bold uppercase tracking-wider opacity-75 mb-1">Highest Single Day</div>

          <div className="text-xs opacity-75 mt-1">{maxDay.report_date!=='—'?dateStr(maxDay.report_date):'No data'}</div>

        <div className="bg-gradient-to-br from-emerald-600 to-emerald-700 rounded-2xl p-4 text-white">
          <div className="text-[10px] font-bold uppercase tracking-wider opacity-75 mb-1">Best Month</div>

          <div className="text-xs opacity-75 mt-1">{maxMonth.month!=='—'?(()=>{const p=String(maxMonth.month).split('-');return MO3X[parseInt(p[1])-1]+' '+p[0];})():'No data'}</div>
        </div>
        <div className="bg-gradient-to-br from-violet-600 to-violet-700 rounded-2xl p-4 text-white">
          <div className="text-[10px] font-bold uppercase tracking-wider opacity-75 mb-1">Busiest Day of Week</div>
          <div className="text-xl font-bold">{topDow.day}</div>
          <div className="text-xs opacity-75 mt-1">{rupee(topDow.amount)} total spend</div>
        </div>
      </div>

      {/* ── Row 2: Daily trend + Vehicle type donut ── */}
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card cls="lg:col-span-2" ch={<>
          <CH title="Daily Spend Trend" sub="Total diesel cost per day"/>
          <div className="h-[240px] px-4 pb-4"><ChartDaily data={stats.by_date} dark={dark}/></div>
        </>}/>
        <Card ch={<>
          <CH title="Vehicle Type Mix" sub="Spend by fleet category"/>
          <div className="px-5 pb-5"><ChartDonut data={stats.by_type} dark={dark}/></div>
        </>}/>
      </div>

      {/* ── Row 3: Monthly + Weekly ── */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card ch={<>
          <CH title="Monthly Spend" sub="Month-by-month total spend"/>
          <div className="h-[230px] px-4 pb-4"><ChartMonthly data={stats.by_month} dark={dark}/></div>
        </>}/>
        <Card ch={<>
          <CH title="Weekly Spend" sub="Week-over-week aggregation"/>
          <div className="h-[230px] px-4 pb-4"><ChartWeek data={stats.by_week} dark={dark}/></div>

                    <td className="py-2.5 px-3 text-sm text-right font-bold text-emerald-700 dark:text-emerald-400 whitespace-nowrap">{rupee(r.amount)}</td>

              {!stats.by_month.length&&<tr><td colSpan={6} className="py-12 text-center text-slate-400 text-sm">No monthly data.</td></tr>}
            </tbody>
          </table>
        </div>

    </div>
  );
}

const TYPEBG=['bg-blue-50 dark:bg-blue-950/40 border-blue-200 dark:border-blue-900/50','bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-900/50','bg-violet-50 dark:bg-violet-950/40 border-violet-200 dark:border-violet-900/50','bg-orange-50 dark:bg-orange-950/40 border-orange-200 dark:border-orange-900/50','bg-cyan-50 dark:bg-cyan-950/40 border-cyan-200 dark:border-cyan-900/50'];

                <div className="text-lg font-bold text-slate-900 dark:text-slate-100">{rupee(t.amount)}</div>
                <div className="text-[10px] text-slate-400 dark:text-slate-500 mt-1">{t.count} fills · {pct}%</div>

            );
          })}
        </div>
      )}
      <Card ch={<>
        <CH title="All Vehicles — Ranked by Total Spend" sub="Click a row to filter by vehicle"/>
        <div className="overflow-auto">
          <table className="w-full text-left border-collapse">
            <thead className="bg-slate-50 dark:bg-slate-800/60"><tr>
              <th className="py-2.5 px-3 text-[11px] font-bold text-slate-500 pl-5 w-10">#</th>
              <Th>Vehicle No</Th><Th>Type</Th>
              <Th right>Trips</Th><Th right>Total Spend</Th>
              <Th right>Avg/Fill</Th><Th right>Max Fill</Th><Th right>Min Fill</Th>
              <th className="py-2.5 px-3 text-[11px] font-bold text-slate-500 text-right pr-5">% Total</th>
            </tr></thead>
            <tbody>
              {stats.all_vehicles.map((v,i)=>{
                const pct=total?(v.amount/total)*100:0;
                return(
                  <Tr key={v.vehicle_no} onClick={()=>onJump('vehicleNo',v.vehicle_no)} cls="hover:bg-blue-50/60 dark:hover:bg-blue-950/20">
                    <Td cls="text-[11px] text-slate-400 font-mono pl-5 whitespace-nowrap">{i+1}</Td>
                    <Td cls="font-bold text-blue-700 dark:text-blue-400 whitespace-nowrap">{v.vehicle_no}</Td>
                    <Td cls="whitespace-nowrap"><Pill>{v.vehicle_type||'—'}</Pill></Td>
                    <Td cls="text-right whitespace-nowrap">{v.trip_count}</Td>
                    <Td cls="text-right font-bold whitespace-nowrap">{rupee(v.amount)}</Td>
                    <Td cls="text-right text-slate-500 dark:text-slate-400 whitespace-nowrap">{rupee(v.avg_amount)}</Td>
                    <Td cls="text-right font-semibold text-red-500 dark:text-red-400 whitespace-nowrap">{rupee(v.max_amount)}</Td>
                    <Td cls="text-right font-semibold text-emerald-600 dark:text-emerald-400 whitespace-nowrap">{rupee(v.min_amount)}</Td>
                    <td className="py-2.5 px-3 text-right pr-5 whitespace-nowrap">
                      <div className="flex items-center justify-end gap-2">
                        <div className="w-12 h-1.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                          <div className="h-full bg-blue-500 rounded-full bar-w" style={{width:`${Math.min(pct,100)}%`}}/>
                        </div>
                        <span className="text-[11px] text-slate-400 w-9 text-right">{pct.toFixed(1)}%</span>
                      </div>
                    </td>
                  </Tr>
                );
              })}
              {!stats.all_vehicles.length&&<Tr><Td cls="py-16 text-center text-slate-400" colSpan={9}>No vehicle data.</Td></Tr>}
            </tbody>
          </table>
        </div>
      </>}/>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   TAB: TRANSACTIONS
═══════════════════════════════════════════════════════ */
const TC=[
  {k:'report_date', l:'Date',    s:true},
  {k:'report_time', l:'Time',    s:false},
  {k:'vehicle_no',  l:'Vehicle', s:true},
  {k:'vehicle_type',l:'Type',    s:true},
  {k:'from_location',l:'From',   s:true},
  {k:'last_location',l:'To',     s:true},
  {k:'current_km',  l:'KM',      s:true,r:true},
  {k:'mileage',     l:'KM/L',    s:true,r:true},
  {k:'diesel_amount',l:'Amount', s:true,r:true},
  {k:'vendor_name', l:'Vendor',  s:true},
  {k:'note',        l:'Note',    s:false},
];

function TabTransactions({rows,filters}){
  const[sort,setSort]=useState({col:'report_date',dir:'desc'});
  const[si,setSi]=useState('');
  const[sq,setSq]=useState('');
  const[pg,setPg]=useState(1);
  const[lim,setLim]=useState(50);
  const stRef=useRef();

  const onSI=v=>{setSi(v);clearTimeout(stRef.current);stRef.current=setTimeout(()=>{setSq(v);setPg(1);},350);};
  const onSort=col=>{setSort(s=>s.col===col?{col,dir:s.dir==='asc'?'desc':'asc'}:{col,dir:'asc'});setPg(1);};

  const fRows=useMemo(()=>{
    let r=filterRows(rows,filters,sq);
    r=[...r].sort((a,b)=>{
      const va=a[sort.col]??'',vb=b[sort.col]??'';
      const na=parseFloat(va),nb=parseFloat(vb);
      const c=(!isNaN(na)&&!isNaN(nb))?(na-nb):String(va).localeCompare(String(vb));
      return sort.dir==='asc'?c:-c;
    });
    return r;
  },[rows,filters,sq,sort]);

  const tot=fRows.length,pages=Math.max(1,Math.ceil(tot/lim));
  const page=useMemo(()=>fRows.slice((pg-1)*lim,pg*lim),[fRows,pg,lim]);

  const exportExcel=()=>{
    if(!fRows.length){toast.err('No data to export');return;}
    
    // Header labels and their respective keys
    const headers = ['Date', 'Time', 'Vehicle No', 'Vehicle Type', 'Mileage', 'From Location', 'Destination', 'Odometer (KM)', 'Diesel Amount', 'Vendor Name', 'Notes'];
    const keys = ['report_date', 'report_time', 'vehicle_no', 'vehicle_type', 'mileage', 'from_location', 'last_location', 'current_km', 'diesel_amount', 'vendor_name', 'note'];

    // Map rows to data structure for sheet
    const data = [];
    
    // Style configurations for headers and body
    const headerStyle = {
      font: { name: 'Segoe UI', sz: 11, bold: true, color: { rgb: 'FFFFFF' } },
      fill: { fgColor: { rgb: '2563EB' } }, // Tailwind Blue-600
      alignment: { horizontal: 'center', vertical: 'center' },
      border: {
        top: { style: 'thin', color: { rgb: 'CBD5E1' } },
        bottom: { style: 'thin', color: { rgb: 'CBD5E1' } },
        left: { style: 'thin', color: { rgb: 'CBD5E1' } },
        right: { style: 'thin', color: { rgb: 'CBD5E1' } }
      }
    };
    
    const bodyStyle = {
      font: { name: 'Segoe UI', sz: 10 },
      alignment: { horizontal: 'center', vertical: 'center' },
      border: {
        top: { style: 'thin', color: { rgb: 'E2E8F0' } },
        bottom: { style: 'thin', color: { rgb: 'E2E8F0' } },
        left: { style: 'thin', color: { rgb: 'E2E8F0' } },
        right: { style: 'thin', color: { rgb: 'E2E8F0' } }
      }
    };

    // Build headers row
    const headerRow = headers.map(h => ({ v: h, t: 's', s: headerStyle }));
    data.push(headerRow);

    // Build data rows
    fRows.forEach(r => {
      const row = keys.map(k => {
        let val = r[k];
        
        // Specific formatting for current_km (odometer) - if 1 or blank, replace with N/A
        if (k === 'current_km') {
          const numVal = parseFloat(val);
          if (isNaN(numVal) || numVal === 1 || String(val).trim() === '' || String(val).trim() === '1') {
            val = 'N/A';
          }
        }
        
        // Formatting for date representation (DD-MM-YYYY)
        if (k === 'report_date' && val) {
          const parts = String(val).split('-');
          if (parts.length === 3) {
            val = `${parts[2]}-${parts[1]}-${parts[0]}`;
          }
        }

        return {
          v: val === undefined || val === null ? '' : val,
          t: typeof val === 'number' ? 'n' : 's',
          s: bodyStyle
        };
      });
      data.push(row);
    });

    // Create workbook and worksheet
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(data);

    // Set column widths based on content
    const colWidths = headers.map((h, colIdx) => {
      let maxLen = h.length;
      data.forEach(row => {
        const valStr = String(row[colIdx]?.v || '');
        if (valStr.length > maxLen) maxLen = valStr.length;
      });
      return { wch: Math.max(maxLen + 4, 12) };
    });
    ws['!cols'] = colWidths;
    
    // Set row heights (Header gets larger height)
    ws['!rows'] = [{ hpt: 26 }];

    XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
    XLSX.writeFile(wb, `diesel_transactions_${new Date().toISOString().slice(0, 10)}.xlsx`);
    toast.ok(`Exported ${num(fRows.length)} records to Excel`);
  };

  const pageNums=useMemo(()=>{
    const st=Math.min(Math.max(1,pg-2),Math.max(1,pages-4));
    return Array.from({length:Math.min(5,pages)},(_,i)=>st+i).filter(p=>p>=1&&p<=pages);
  },[pg,pages]);

  const sof=col=>sort.col===col?sort.dir:null;

  return(
    <Card cls="anim-fadeup" ch={<>
      <div className="pt-5 pb-3 px-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <p className="font-semibold text-sm text-slate-900 dark:text-slate-100">All Transactions</p>
          <p className="text-xs text-slate-500 dark:text-slate-500 mt-0.5">{num(tot)} records · page {pg}/{pages}</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <div className="relative">
            <span className="absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"><Ic.search c="w-3.5 h-3.5 text-slate-400"/></span>
            <input type="search" placeholder="Search…" value={si} onChange={e=>onSI(e.target.value)}
              className="pl-8 pr-3 h-8 w-52 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 outline-none focus:border-blue-400 placeholder-slate-400 transition-colors"/>
          </div>
          <select value={lim} onChange={e=>{setLim(+e.target.value);setPg(1);}} className="h-8 px-2 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 outline-none cursor-pointer">
            {[25,50,100,250].map(n=><option key={n} value={n}>{n} / page</option>)}
          </select>
          <button onClick={exportExcel} className="h-8 px-3 text-xs font-medium rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors flex items-center gap-1.5">
            <Ic.download c="w-3.5 h-3.5"/> Export Excel
          </button>
        </div>
      </div>
      <div className="hidden md:block overflow-auto">
        <table className="w-full text-left border-collapse">
          <thead className="bg-slate-50 dark:bg-slate-800/60 sticky top-0">
            <tr>
              <th className="py-2.5 pl-5 pr-3 text-[11px] font-bold text-slate-500 w-10">#</th>
              {TC.map(c=>(
                <Th key={c.k} right={c.r} sortable={c.s} sorted={sof(c.k)} onClick={c.s?()=>onSort(c.k):null}>{c.l}</Th>
              ))}
            </tr>
          </thead>
          <tbody>
            {page.map((r,i)=>(
              <Tr key={i} cls="hover:bg-slate-50/80 dark:hover:bg-slate-800/40">
                <Td cls="text-[11px] text-slate-400 font-mono pl-5 whitespace-nowrap">{(pg-1)*lim+i+1}</Td>
                <Td cls="whitespace-nowrap font-medium">{dateStr(r.report_date)}</Td>
                <Td cls="text-slate-400 dark:text-slate-500 whitespace-nowrap">{String(r.report_time??'—')}</Td>
                <Td cls="font-bold text-blue-700 dark:text-blue-400 whitespace-nowrap">{String(r.vehicle_no??'—')}</Td>
                <Td cls="whitespace-nowrap">{r.vehicle_type?<Pill>{String(r.vehicle_type)}</Pill>:null}</Td>
                <Td cls="max-w-[110px] truncate text-slate-500 dark:text-slate-400 whitespace-nowrap">{String(r.from_location??'—')}</Td>
                <Td cls="max-w-[110px] truncate text-slate-500 dark:text-slate-400 whitespace-nowrap">{String(r.last_location??'—')}</Td>
                <Td cls="text-right font-mono whitespace-nowrap">{r.current_km?num(r.current_km):'—'}</Td>
                <Td cls="text-right font-mono text-slate-400 whitespace-nowrap">{r.mileage?Number(r.mileage).toFixed(1):'—'}</Td>
                <Td cls="text-right font-bold text-emerald-700 dark:text-emerald-400 whitespace-nowrap">{rupee(r.diesel_amount)}</Td>
                <Td cls="max-w-[110px] truncate text-slate-500 dark:text-slate-400 whitespace-nowrap">{String(r.vendor_name??'—')}</Td>
                <Td cls="max-w-[100px] truncate text-slate-400 dark:text-slate-600 text-xs">{String(r.note??'')}</Td>
              </Tr>
            ))}
            {!page.length&&<Tr><Td cls="py-20 text-center text-slate-400 whitespace-nowrap" colSpan={12}>{tot===0?'No transactions match your filters.':'No data.'}</Td></Tr>}
          </tbody>
        </table>
      </div>

      {/* Mobile Card List */}
      <div className="md:hidden divide-y divide-slate-100 dark:divide-slate-800">
        {page.map((r, i) => (
          <div key={i} className="p-4 space-y-2.5 hover:bg-slate-50/50 dark:hover:bg-slate-800/20 transition-colors">
            {/* Row 1: Vehicle and Date */}
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-2">
                <span className="font-bold text-blue-700 dark:text-blue-400 text-sm">
                  {String(r.vehicle_no ?? '—')}
                </span>
                {r.vehicle_type && <Pill>{String(r.vehicle_type)}</Pill>}
              </div>
              <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">
                {dateStr(r.report_date)} {r.report_time ? ` · ${r.report_time}` : ''}
              </span>
            </div>

            {/* Row 2: Location flow */}
            <div className="flex items-center gap-1.5 text-xs text-slate-600 dark:text-slate-400">
              <span className="truncate max-w-[120px]">{String(r.from_location ?? '—')}</span>
              <svg xmlns="http://www.w3.org/2000/svg" className="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path d="M9 5l7 7-7 7"/></svg>
              <span className="truncate max-w-[120px]">{String(r.last_location ?? '—')}</span>
            </div>

            {/* Row 3: Metrics (KM, KM/L, Amount, Vendor) */}
            <div className="flex items-center justify-between pt-1 flex-wrap gap-2">
              <div className="flex items-center gap-3 text-[11px] text-slate-500 dark:text-slate-400 font-mono">
                {r.current_km ? <span>{num(r.current_km)} KM</span> : null}
                {r.mileage ? <span>{Number(r.mileage).toFixed(1)} KM/L</span> : null}
                <span className="truncate max-w-[100px] text-slate-400">{String(r.vendor_name ?? '—')}</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="font-bold text-sm text-emerald-700 dark:text-emerald-400">
                  {rupee(r.diesel_amount)}
                </span>
              </div>
            </div>

            {/* Optional Note */}
            {r.note && (
              <p className="text-[11px] text-slate-400 dark:text-slate-600 bg-slate-50 dark:bg-slate-900/60 rounded px-2 py-1 italic truncate">
                Note: {String(r.note)}
              </p>
            )}
          </div>
        ))}
        {!page.length && (
          <div className="py-20 text-center text-slate-400 text-sm">
            {tot===0?'No transactions match your filters.':'No data.'}
          </div>
        )}
      </div>
      {pages>1&&(
        <div className="flex items-center justify-between px-5 py-3 border-t border-slate-100 dark:border-slate-800">
          <p className="text-xs text-slate-500 dark:text-slate-500">Showing {num((pg-1)*lim+1)}–{num(Math.min(pg*lim,tot))} of {num(tot)}</p>
          <div className="flex items-center gap-1">
            <button onClick={()=>setPg(p=>Math.max(1,p-1))} disabled={pg===1} className="w-8 h-8 rounded-lg flex items-center justify-center border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"><Ic.chevL c="w-4 h-4"/></button>
            {pageNums.map(p=>(
              <button key={p} onClick={()=>setPg(p)} className={`w-8 h-8 rounded-lg text-xs font-medium transition-colors ${p===pg?'bg-blue-600 text-white':'border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>{p}</button>
            ))}
            <button onClick={()=>setPg(p=>Math.min(pages,p+1))} disabled={pg===pages} className="w-8 h-8 rounded-lg flex items-center justify-center border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"><Ic.chevR c="w-4 h-4"/></button>
          </div>
        </div>
      )}
    </>}/>
  );
}

/* ═══════════════════════════════════════════════════════
   TAB: IMPORT
═══════════════════════════════════════════════════════ */
const COLINFO=[
  {l:'Date',         a:['date','report_date','report date']},
  {l:'Vehicle No',   a:['vehicle no','vehicle number','vehicle','veh no']},
  {l:'Vehicle Type', a:['vehicle type','type','veh type']},
  {l:'Diesel Amount',a:['diesel amount','fuel amount','amount','diesel','fuel']},
  {l:'Vendor Name',  a:['vendor name','vendor','supplier','petrol pump']},
  {l:'From Location',a:['from location','from','origin']},
  {l:'To Location',  a:['last location','to location','to','destination']},
  {l:'KM Reading',   a:['current km','odometer','km reading','km']},
  {l:'Mileage',      a:['mileage','km/l','kmpl','fuel efficiency']},
  {l:'Notes',        a:['note','notes','remarks','comment']},
];

function TabImport({onImportData,onDone}){
  return(
    <div className="space-y-5 anim-fadeup">
      <UploadBox onImportData={onImportData} onDone={onDone}/>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        <Card ch={
          <div className="p-5 space-y-3">
            <div className="flex items-center gap-2.5 mb-3">
              <div className="w-8 h-8 rounded-lg bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center"><Ic.info c="w-4 h-4 text-blue-600 dark:text-blue-400"/></div>
              <span className="font-semibold text-sm text-slate-900 dark:text-slate-100">Supported Column Names</span>
            </div>
            {COLINFO.map(c=>(
              <div key={c.l} className="flex items-start gap-3">
                <span className="text-xs font-semibold text-slate-500 dark:text-slate-400 min-w-[100px] pt-0.5">{c.l}</span>
                <div className="flex flex-wrap gap-1">{c.a.map(a=><code key={a} className="text-[10px] rounded px-1.5 py-0.5 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-mono">{a}</code>)}</div>
              </div>
            ))}

const FULL_MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MO3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── helpers ── */
const fmtDate=raw=>{
  if(!raw)return'—';
  const p=String(raw).split(/[-T ]/);
  if(p.length>=3){const m=parseInt(p[1])-1;return`${parseInt(p[2])} ${MO3[m]||''} ${p[0]}`;}
  return String(raw);
};
const fmtWeekRange=(ws)=>{
  const endD=new Date(ws);endD.setDate(endD.getDate()+6);
  const sp=ws.split('-'), ep=endD.toISOString().split('T')[0].split('-');
  return`${parseInt(sp[2])} ${MO3[parseInt(sp[1])-1]} – ${parseInt(ep[2])} ${MO3[parseInt(ep[1])-1]} ${ep[0]}`;
};
const fmtMonth=(ym)=>{
  const p=ym.split('-');
  return`${FULL_MO[parseInt(p[1])-1]||''} ${p[0]}`;
};

function ReportSummaryCard({title,sub,amount,count,periods,unit,active,onClick,colorIdx}){
  const palettes=[
    {bg:'bg-blue-50 dark:bg-blue-950/40 border-blue-200 dark:border-blue-800', lbl:'text-blue-600 dark:text-blue-400', val:'text-blue-900 dark:text-blue-100', ring:'ring-blue-500'},
    {bg:'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800', lbl:'text-emerald-600 dark:text-emerald-400', val:'text-emerald-900 dark:text-emerald-100', ring:'ring-emerald-500'},
    {bg:'bg-violet-50 dark:bg-violet-950/40 border-violet-200 dark:border-violet-800', lbl:'text-violet-600 dark:text-violet-400', val:'text-violet-900 dark:text-violet-100', ring:'ring-violet-500'},
  ];
  const p=palettes[colorIdx]||palettes[0];
  return(
    <div onClick={onClick} className={`border rounded-2xl p-5 cursor-pointer hover-lift transition-all ${p.bg} ${active?`ring-2 ${p.ring}`:''}`}>
      <div className={`text-[10px] font-bold uppercase tracking-wider mb-2 ${p.lbl}`}>{title}</div>
      <div className={`text-xs mb-1 ${p.lbl} opacity-80`}>{sub}</div>
      <div className={`text-2xl font-bold leading-tight ${p.val}`}>{rupee(amount)}</div>
      <div className="text-xs text-slate-500 dark:text-slate-400 mt-2">{count} transactions · {periods} {unit}</div>
    </div>
  );
}

function ReportTable({data}){
  const total=data.reduce((s,r)=>s+(r.amount||0),0);
  const maxA=Math.max(...data.map(r=>r.amount||0),1);
  return(
    <div className="overflow-auto">
      <table className="w-full text-left border-collapse">
        <thead className="bg-slate-50 dark:bg-slate-800/60 sticky top-0">
          <tr>
            <th className="py-2.5 pl-5 pr-2 text-[11px] font-bold text-slate-500 w-9">#</th>
            <th className="py-2.5 px-3 text-[11px] font-bold text-slate-500">Period</th>
            <th className="py-2.5 px-3 text-[11px] font-bold text-slate-500 text-right">Transactions</th>
            <th className="py-2.5 px-3 text-[11px] font-bold text-slate-500 text-right">Total Spend</th>
            <th className="py-2.5 px-3 text-[11px] font-bold text-slate-500 text-right">Avg / Fill</th>
            <th className="py-2.5 px-3 text-[11px] font-bold text-slate-500 text-right">% of Total</th>
            <th className="py-2.5 px-3 text-[11px] font-bold text-slate-500 min-w-[120px]">Spend Bar</th>
          </tr>
        </thead>
        <tbody>
          {data.map((r,i)=>{
            const amt=r.amount||0, cnt=r.count||0;
            const pct=total?((amt/total)*100).toFixed(1):'0';
            const avg=cnt?Math.round(amt/cnt):0;
            const barPct=(amt/maxA)*100;
            return(
              <tr key={i} className="border-b border-slate-100 dark:border-slate-800 hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition-colors">
                <td className="py-2.5 pl-5 pr-2 text-[11px] text-slate-400 font-mono whitespace-nowrap">{i+1}</td>
                <td className="py-2.5 px-3 text-sm font-semibold text-slate-800 dark:text-slate-200 whitespace-nowrap">{r.label}</td>
                <td className="py-2.5 px-3 text-sm text-right text-slate-600 dark:text-slate-400 whitespace-nowrap">{cnt}</td>
                <td className="py-2.5 px-3 text-sm text-right font-bold text-emerald-700 dark:text-emerald-400 whitespace-nowrap">{rupee(amt)}</td>
                <td className="py-2.5 px-3 text-sm text-right text-slate-500 dark:text-slate-400 whitespace-nowrap">{rupee(avg)}</td>
                <td className="py-2.5 px-3 text-sm text-right text-slate-400 whitespace-nowrap">{pct}%</td>
                <td className="py-2.5 px-3 whitespace-nowrap">
                  <div className="h-2 bg-slate-100 dark:bg-slate-700/60 rounded-full overflow-hidden">
                    <div className="h-full rounded-full bar-w" style={{width:`${barPct}%`,background:col(i)}}/>
                  </div>
                </td>
              </tr>
            );
          })}
          {!data.length&&(
            <tr><td colSpan={7} className="py-16 text-center text-slate-400 text-sm">No data available.</td></tr>
          )}
        </tbody>
        {data.length>0&&(
          <tfoot className="bg-slate-50 dark:bg-slate-800/60">
            <tr>
              <td colSpan={2} className="py-3 pl-5 text-xs font-bold text-slate-600 dark:text-slate-300">
                TOTAL ({data.length} {data.length===1?'period':'periods'})

}

function TabReports({stats,dark}){
  const[rv,setRv]=useState('daily');
  const[sortDir,setSortDir]=useState('asc');

  /* ── Build period arrays from stats ── */
  const dailyData=useMemo(()=>
    stats.by_date.map(r=>({
      label:fmtDate(r.report_date),
      amount:r.amount,
      count:r.count,
    }))
  ,[stats]);

  const weeklyData=useMemo(()=>
    stats.by_week.map(r=>({
      label:fmtWeekRange(r.week_start),
      amount:r.amount,
      count:r.count,
    }))
  ,[stats]);

  const monthlyData=useMemo(()=>
    stats.by_month.map(r=>({
      label:fmtMonth(r.month),
      amount:r.amount,
      count:r.count,
    }))
  ,[stats]);

  /* ── Latest period values (most recent entry) ── */
  const latestDay   =dailyData[dailyData.length-1]   ||{label:'—',amount:0,count:0};
  const latestWeek  =weeklyData[weeklyData.length-1]  ||{label:'—',amount:0,count:0};
  const latestMonth =monthlyData[monthlyData.length-1]||{label:'—',amount:0,count:0};

  const RVTABS=[
    {id:'daily',   label:'Daily',   data:dailyData,   unit:'days',   latestAmt:latestDay.amount,   latestSub:latestDay.label,   latestCnt:latestDay.count},
    {id:'weekly',  label:'Weekly',  data:weeklyData,  unit:'weeks',  latestAmt:latestWeek.amount,  latestSub:latestWeek.label,  latestCnt:latestWeek.count},
    {id:'monthly', label:'Monthly', data:monthlyData, unit:'months', latestAmt:latestMonth.amount, latestSub:latestMonth.label, latestCnt:latestMonth.count},
  ];

  const active=RVTABS.find(t=>t.id===rv)||RVTABS[0];
  const tc=dark?'#64748b':'#94a3b8', gc=dark?'#1e293b':'#f1f5f9';

  const exportCSV=()=>{
    if(!active.data.length){toast.err('No data');return;}
    const tot=active.data.reduce((s,r)=>s+r.amount,0);
    const cols=['Period','Transactions','Total Spend (₹)','Avg per Fill (₹)','% of Total'];
    const rows2=active.data.map(r=>{
      const pct=tot?((r.amount/tot)*100).toFixed(1):'0';
      const avg=r.count?Math.round(r.amount/r.count):0;
      return[r.label,r.count,Math.round(r.amount),avg,pct];
    });
    const csv=[cols.join(','),...rows2.map(r=>r.map(c=>`"${c}"`).join(','))].join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download=`${active.id}_report_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();URL.revokeObjectURL(a.href);
    toast.ok(`Exported ${active.label} report`);
  };

  return(
    <div className="space-y-4 anim-fadeup">

      {/* ── Summary Cards: latest period value per type ── */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        {RVTABS.map((rt,i)=>(
          <ReportSummaryCard key={rt.id}
            title={`${rt.label} Report`}
            sub={`Latest: ${rt.latestSub}`}
            amount={rt.latestAmt}
            count={rt.latestCnt}
            periods={rt.data.length}
            unit={rt.unit}
            active={rv===rt.id}
            onClick={()=>{setRv(rt.id);setSortDir('asc');}}
            colorIdx={i}
          />
        ))}
      </div>

      {/* ── Sub-tab selector ── */}
      <div className="flex items-center gap-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-1 w-fit shadow-sm">
        {RVTABS.map(rt=>(
          <button key={rt.id} onClick={()=>setRv(rt.id)}
            className={`px-5 py-1.5 rounded-lg text-sm font-medium tab-t ${rv===rt.id?'bg-blue-600 text-white shadow-sm':'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-slate-800 dark:hover:text-slate-200'}`}>
            {rt.label}
          </button>

      </div>

      {/* ── Chart ── */}
      <Card ch={<>
        <div className="pt-5 pb-2 px-5 flex items-start justify-between gap-3 flex-wrap">
          <div>
            <p className="font-semibold text-sm text-slate-900 dark:text-slate-100">{active.label} Spend Chart</p>
            <p className="text-xs text-slate-500 dark:text-slate-500 mt-0.5">
              {active.data.length} {active.unit} · {rupee(active.data.reduce((s,r)=>s+r.amount,0))} total · {active.data.reduce((s,r)=>s+r.count,0)} transactions
            </p>
          </div>
        </div>
        <div className="h-[280px] px-4 pb-4">
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={active.data.map(d=>({lbl:d.label,v:d.amount,c:d.count}))} margin={{top:8,right:8,left:0,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={gc}/>
              <XAxis dataKey="lbl" fontSize={10} tickLine={false} axisLine={false} interval="preserveStartEnd" tick={{fill:tc}}/>
              <YAxis fontSize={11} tickLine={false} axisLine={false} tickFormatter={short} width={62} tick={{fill:tc}}/>
              <Tooltip contentStyle={tipSt(dark)}
                formatter={(v,n,props)=>[rupee(v)+' · '+props.payload.c+' fills',active.label+' Spend']}
                labelStyle={{fontWeight:600,marginBottom:4}}/>
              <Bar dataKey="v" radius={[5,5,0,0]} maxBarSize={52}>
                {active.data.map((_,i)=><Cell key={i} fill={col(i)}/>)}

      {/* ── Breakdown Table ── */}

        <div className="pt-5 pb-3 px-5 flex items-center justify-between gap-3 flex-wrap">

          </div>
          <div className="flex items-center gap-2 flex-wrap">
            {/* Sort order toggle */}
            <div className="flex items-center gap-0.5 bg-slate-100 dark:bg-slate-800 rounded-lg p-0.5">
              <button onClick={()=>setSortDir('asc')}
                className={`h-7 px-3 text-[11px] font-medium rounded-md transition-colors flex items-center gap-1.5
                  ${sortDir==='asc'?'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 shadow-sm':'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                <svg xmlns="http://www.w3.org/2000/svg" className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path d="M12 5v14M5 12l7-7 7 7"/></svg>
                Oldest First
              </button>
              <button onClick={()=>setSortDir('desc')}
                className={`h-7 px-3 text-[11px] font-medium rounded-md transition-colors flex items-center gap-1.5
                  ${sortDir==='desc'?'bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 shadow-sm':'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                <svg xmlns="http://www.w3.org/2000/svg" className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path d="M12 19V5M5 12l7 7 7-7"/></svg>
                Newest First

            <button onClick={exportCSV}

              <Ic.download c="w-3.5 h-3.5"/> Export CSV
            </button>
          </div>
        </div>
        <ReportTable data={sortDir==='desc'?[...active.data].reverse():active.data}/>
      </>}/>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════

const TABS=[
  {id:'overview',     label:'Overview',     Ic:Ic.dash},
  {id:'reports',      label:'Reports',      Ic:Ic.cal},
  {id:'vehicles',     label:'Vehicles',     Ic:Ic.truck},
  {id:'vendors',      label:'Vendors',      Ic:Ic.bldg},
  {id:'locations',    label:'Locations',    Ic:Ic.pin},
  {id:'transactions', label:'Transactions', Ic:Ic.file},
];

const mapFromFirebase = e => ({
  id: e.responseNumber ? String(e.responseNumber) : '',
  report_date: parseDate(e.date) || '',
  report_time: e.time || '',
  vehicle_no: e.vehicleNo || '',
  vehicle_type: e.vehicleType || '',
  from_location: e.fromLocation || '',
  last_location: e.lastLocation || '',
  current_km: e.currentKm ? parseFloat(e.currentKm) : 0,
  mileage: e.mileage ? parseFloat(e.mileage) : 0,
  diesel_amount: e.dieselAmount ? parseFloat(e.dieselAmount) : 0,
  vendor_name: e.vendorName || '',
  note: e.note || ''
});

function App(){
  const[tab,setTab]    =useState('overview');
  const[sf,setSf]      =useState(false);
  const[filters,setFlt]=useState(EF);
  const[dark,setDark]  =useState(()=>localStorage.getItem('rpm_dark')==='1');
  const[rows,setRows]  =useState(()=>load());
  const[loading,setLoading]=useState(false);
  const[connected,setConnected]=useState(false);
  const[showExportModal,setShowExportModal]=useState(false);
  const[exportStart,setExportStart]=useState('');
  const[exportEnd,setExportEnd]=useState('');

  useEffect(()=>{
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    setExportStart(`${year}-${month}-01`);
    setExportEnd(`${year}-${month}-${day}`);
  },[]);

  const handleExportSubmit = () => {
    if (!exportStart || !exportEnd) {
      toast.err("Please select both Start Date and End Date.");
      return;
    }

    const startDate = new Date(exportStart + 'T00:00:00');
    const endDate = new Date(exportEnd + 'T23:59:59');

    if (startDate > endDate) {
      toast.err("Start Date cannot be after End Date.");
      return;
    }

    // Filter fRows (which is ALREADY filtered by active filters: Vendor, Vehicle, Location, Amount, etc.)
    const filtered = fRows.filter(r => {
      if (!r.report_date) return true;
      const rDate = new Date(r.report_date + 'T12:00:00');
      return rDate >= startDate && rDate <= endDate;
    });

    if (filtered.length === 0) {
      toast.err("No transaction records match the active filters in selected date range.");
      return;
    }

    // Sort ascending
    const sorted = [...filtered].sort((a,b) => new Date(a.report_date) - new Date(b.report_date));

    // Headers & Format
    const headers = [
      "Response #", "Date", "Time", "Vehicle No", "Vehicle Type", "Mileage",
      "From Location", "Last Location", "Current KM", "Diesel Amount", "Vendor Name", "Note"
    ];

    const exportData = sorted.map(r => {
      let formattedDate = r.report_date || '';
      const p = formattedDate.split('-');
      if (p.length === 3) formattedDate = `${p[2]}-${p[1]}-${p[0]}`;

      let kmVal = r.current_km;
      if (!kmVal || String(kmVal).trim() === '1' || String(kmVal).trim() === '0' || String(kmVal).trim() === 'N/A') {
        kmVal = 'N/A';
      }

      return {
        "Response #": r.id || '-',
        "Date": formattedDate,
        "Time": r.report_time || '',
        "Vehicle No": r.vehicle_no || '-',
        "Vehicle Type": r.vehicle_type || '-',
        "Mileage": r.mileage || '-',
        "From Location": r.from_location || '-',
        "Last Location": r.last_location || '-',
        "Current KM": kmVal,
        "Diesel Amount": r.diesel_amount || 0,
        "Vendor Name": r.vendor_name || '-',
        "Note": r.note || ''
      };
    });

    const ws = XLSX.utils.json_to_sheet(exportData, { header: headers });

    // Style headers
    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let C = range.s.c; C <= range.e.c; ++C) {
      const address = XLSX.utils.encode_cell({ r: 0, c: C });
      if (!ws[address]) continue;
      ws[address].s = {
        fill: { fgColor: { rgb: "1E40AF" } },
        font: { name: "Calibri", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
        alignment: { horizontal: "center", vertical: "center" }
      };
    }

    ws['!cols'] = [
      { wch: 14 }, { wch: 14 }, { wch: 10 }, { wch: 16 }, { wch: 14 },
      { wch: 10 }, { wch: 22 }, { wch: 22 }, { wch: 14 }, { wch: 15 },
      { wch: 25 }, { wch: 30 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Diesel Transactions");
    
    // Filename with only Year (e.g. Diesel_Report_2026.xlsx)
    const yearStr = new Date().getFullYear();
    const filename = `Diesel_Report_${yearStr}.xlsx`;
    
    XLSX.writeFile(wb, filename);

    setShowExportModal(false);
    toast.ok(`Exported ${sorted.length} transactions to Excel!`);
  };

  useEffect(()=>{
    document.documentElement.classList.toggle('dark',dark);
    localStorage.setItem('rpm_dark',dark?'1':'');
  },[dark]);

  useEffect(()=>{
    const onConnectionChange = snap => {
      setConnected(!!snap.val());
    };
    connectedRef.on('value', onConnectionChange);

    const onEntriesChange = snap => {
      const val = snap.val();
      let parsed = [];
      if(val){
        parsed = Object.values(val)
          .filter(e => e)
          .map(mapFromFirebase);
        parsed.sort((a,b)=>{
          const numA = parseInt(a.id) || 0;
          const numB = parseInt(b.id) || 0;
          return numB - numA;
        });
      }
      setRows(parsed);
      save(parsed);
      setLoading(false);
    };
    entriesRef.on('value', onEntriesChange);

    return () => {
      connectedRef.off('value', onConnectionChange);
      entriesRef.off('value', onEntriesChange);
    };
  },[]);

  useEffect(() => {
    const handleMessage = (event) => {
      const data = event.data;
      if (!data) return;
      
      if (data.type === 'applyFilters') {
        const parentFilters = data.filters;
        const info = getAssignedVendorInfo();
        const msgVendor = data.assignedVendor || info.vendor;
        const msgIsLocked = info.isLocked || data.role === 'vendor' || !!msgVendor;
        const targetVendor = msgVendor || info.vendor;

        const vendorVal = msgIsLocked
          ? (targetVendor ? [targetVendor] : [])
          : (Array.isArray(parentFilters.vendor)
              ? (parentFilters.vendor.includes('All') ? [] : parentFilters.vendor)
              : (parentFilters.vendor === 'All' ? [] : [parentFilters.vendor]));

        setFlt({
          startDate: parentFilters.dateFrom || '',
          endDate: parentFilters.dateTo || '',
          vehicleType: Array.isArray(parentFilters.vehicleType)
            ? (parentFilters.vehicleType.includes('All') ? [] : parentFilters.vehicleType)
            : (parentFilters.vehicleType === 'All' ? [] : [parentFilters.vehicleType]),
          vehicleNo: Array.isArray(parentFilters.vehicleNo)
            ? (parentFilters.vehicleNo.includes('All') ? [] : parentFilters.vehicleNo)
            : (parentFilters.vehicleNo === 'All' ? [] : [parentFilters.vehicleNo]),

            endDate: parentFilters.dateTo || '',
            vehicleType: Array.isArray(parentFilters.vehicleType)

l flex-shrink-0 shadow" alt="RPM Logo"/>
            <div className="min-w-0">
              <h1 className="text-sm font-bold text-slate-900 dark:text-slate-100 leading-tight whitespace-nowrap">RPM LOGISTICES PVT LTD</h1>
              {stats
                ? <p className="hidden sm:block text-[11px] text-slate-500 dark:text-slate-500 leading-tight">
                    {num(stats.summary.total_entries)} records · {rupee(stats.summary.total_spend)} · {num(stats.summary.active_days)} days
                    {fc>0&&<span className="ml-2 text-blue-600 dark:text-blue-400 font-semibold">({fc} filter{fc>1?'s':''} active)</span>}
                  </p>
                : <p className="hidden sm:block text-[11px] text-slate-400 dark:text-slate-600 leading-tight">Diesel Analytics · Import data to begin</p>
              }
            </div>
          </div>

          <div className="flex items-center gap-2 flex-shrink-0 flex-wrap">
            {loading && (
              <div className="flex items-center gap-1.5 text-[11px] text-slate-400 dark:text-slate-500 font-medium select-none">
                <Ic.spin c="w-3.5 h-3.5 text-blue-500"/>
                <span>Syncing...</span>
              </div>
            )}
            <div className="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/50 px-2.5 py-1 rounded-full text-[11px] font-semibold select-none">
              <span className={`w-2 h-2 rounded-full ${connected ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`} />
              <span className="text-slate-600 dark:text-slate-300">
                {connected ? 'Online' : 'Offline'}
              </span>
            </div>
            <button onClick={()=>setSf(x=>!x)}
              className={`h-8 px-3 text-xs font-medium rounded-lg border transition-all flex items-center gap-2 ${sf?'bg-blue-600 text-white border-blue-600':'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>
              <Ic.filter c="w-3.5 h-3.5"/> Filters
              {fc>0&&<span className={`rounded-full text-[10px] font-bold h-4 min-w-[16px] px-1 flex items-center justify-center ${sf?'bg-white text-blue-600':'bg-blue-600 text-white'}`}>{fc}</span>}
            </button>
            <button onClick={()=>setDark(d=>!d)} title={dark?'Light mode':'Dark mode'}
              className="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors flex items-center justify-center">
              {dark?<Ic.sun c="w-3.5 h-3.5 text-amber-400"/>:<Ic.moon c="w-3.5 h-3.5"/>}
