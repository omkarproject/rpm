      </header>

      {/* ── PAGE ── */}
      <main className="max-w-none mx-auto px-5 py-5 space-y-4">

        {/* Filter panel */}
        {sf&&<FilterPanel filters={filters} opts={opts} setF={setF} reset={reset} close={()=>setSf(false)} fc={fc}/>}

        {/* KPI row */}
        {stats&&<KpiCards stats={stats}/>}

        {/* Empty state */}
        {!stats&&(
          <div className="bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl py-24 text-center anim-fadeup">
            <div className="w-16 h-16 rounded-2xl bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center mx-auto mb-4">
              <Ic.fuel c="w-8 h-8 text-blue-600 dark:text-blue-400"/>
            </div>
            <h2 className="text-lg font-semibold text-slate-800 dark:text-slate-200 mb-2">No fuel data yet</h2>
            <p className="text-sm text-slate-500 dark:text-slate-400">Waiting for records from the database...</p>
          </div>
        )}

        {/* Tab bar */}
        <div className="flex gap-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-1.5 shadow-sm overflow-x-auto scrollbar-none items-center">
          {TABS.map(({id,label,Ic:TIc})=>(
            <button key={id} onClick={()=>setTab(id)}
              className={`tab-t flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap flex-shrink-0 ${tab===id?'bg-blue-600 text-white shadow-sm':'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-slate-800 dark:hover:text-slate-200'}`}>
              <TIc c="w-4 h-4"/> {label}
            </button>
          ))}
          <button onClick={()=>{
            if (filters.startDate) setExportStart(filters.startDate);
            if (filters.endDate) setExportEnd(filters.endDate);
            setShowExportModal(true);
            if (window.parent && window.parent.openExportDateModal) {
              window.parent.openExportDateModal();
            }
          }} className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold bg-emerald-600/10 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-600 hover:text-white border border-emerald-500/30 whitespace-nowrap ml-auto transition-all cursor-pointer">
            <Ic.file c="w-4 h-4"/> Export Excel
          </button>
        </div>

        {/* Date Range Export Modal Overlay */}
        {showExportModal && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4 anim-fadeup">
            <div className="bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden">
              <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-emerald-500/10">
                <h3 className="text-sm font-black text-emerald-600 dark:text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                  <Ic.file c="w-4 h-4"/> Export Excel Data
                </h3>
                <button onClick={()=>setShowExportModal(false)} className="w-8 h-8 flex items-center justify-center rounded-xl bg-slate-100 hover:bg-rose-100 dark:bg-slate-800 dark:hover:bg-rose-900/30 text-slate-500 hover:text-rose-500 transition-colors">
                  ✕
                </button>
              </div>
              
              <div className="p-5 space-y-4">

                  </button>
                </div>
              </div>
            </div>
          </div>

          if (androidIdx !== -1 && androidIdx + 1 < parts.length) {
            let model = parts[androidIdx + 1].trim();

  <!-- Seamless IFrame Mouse Pointer & Parallax Effect Bridge + local 3D Tilt Effect -->
  <script>
    // 1. Forward mouse coordinates & hover events to parent page
    window.addEventListener('mousemove', (e) => {
      window.parent.postMessage({
        type: 'iframeMousemove',
        clientX: e.clientX,
        clientY: e.clientY
      }, '*');
    });

    document.addEventListener('mouseover', (e) => {
      const target = e.target;
      if (!target) return;
      const isHoverable = 
        target.tagName === 'A' || 
        target.tagName === 'BUTTON' || 
        target.tagName === 'INPUT' || 
        target.tagName === 'SELECT' || 
        target.tagName === 'TEXTAREA' || 
        target.classList.contains('cursor-pointer') ||
        target.closest('.glass-card-interactive') ||
        target.closest('.report-tab');
      
      window.parent.postMessage({
        type: 'iframeHover',
        hovering: !!isHoverable
      }, '*');
    });

    // 2. Implement local 3D Card Tilt Depth Effect for cards inside the iframe
    document.addEventListener('mousemove', (e) => {
      if (document.documentElement.classList.contains('low-spec')) return;
      const card = e.target.closest('.glass-card-interactive');
      if (!card) return;
      
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const xc = rect.width / 2;
      const yc = rect.height / 2;
      
      const angleX = (yc - y) / 10;
      const angleY = (x - xc) / 10;
      
      card.style.transform = `perspective(1000px) rotateX(${angleX}deg) rotateY(${angleY}deg) scale3d(1.02, 1.02, 1.02)`;
      card.style.boxShadow = `0 15px 30px rgba(0,0,0,0.3)`;
    });

    document.addEventListener('mouseout', (e) => {
      const card = e.target.closest('.glass-card-interactive');
      if (!card) return;
      card.style.transform = '';
      card.style.boxShadow = '';
    });
  </script>
